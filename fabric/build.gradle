plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    implementation("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    implementation("com.terraformersmc:modmenu:${mod_menu_version}")

    compileOnlyApi("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    //runtimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")

    runtimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:$rei_version"
    runtimeOnly "dev.architectury:architectury-fabric:$architectury_version"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        // the client run contains the test mod "bucketlibtest" (test buckets) for manual tests
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
            source sourceSets.gametest
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        // GameTests (see TESTING.md): ./gradlew :fabric:runGameTestServer
        gameTestServer {
            server()
            setConfigName('Fabric GameTest Server')
            ideConfigGenerated(true)
            source(sourceSets.gametest)
            runDir('runs/gametest')
            property('fabric-api.gametest')
            property('bucketlibtest.gameTestRun', 'true') // registers all test fluids (TestFluids.REGISTERED)
            property('fabric-api.gametest.filter', "${mod_id}:*".toString())
            property('fabric-api.gametest.report-file', file('build/gametest-report.xml').absolutePath)
        }
    }
}

// REI is only needed in the client run. On the game test server it only logs errors for every brewing recipe
// ("Failed to fill display for recipe"), so it is removed from the classpath of the game test run.
afterEvaluate {
    tasks.named('runGameTestServer', JavaExec) {
        classpath = classpath.filter { !it.name.startsWith('RoughlyEnoughItems') }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}