plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}
base {
    archivesName = "${mod_id}-neoforge"
}

// NeoforgeUniversalBucketItemMixin changes UniversalBucketItem, so its execution data never matches the class file
// ("Classes in bundle 'neoforge' do not match with execution data"). It is measured by the Fabric run instead.
jacocoCoverageExcludes.add('de/cech12/bucketlib/api/item/UniversalBucketItem.class')

dependencies {
    compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    compileOnly("me.shedaniel:RoughlyEnoughItems-api-neoforge:$rei_version")
    //runtimeOnly("me.shedaniel:RoughlyEnoughItems-neoforge:$rei_version")
    //runtimeOnly("me.shedaniel.cloth:cloth-config-neoforge:$cloth_config_version")
    //runtimeOnly("dev.architectury:architectury-neoforge:$architectury_version")
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    addModdingDependenciesTo sourceSets.gametest
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        // test mod with the test buckets and the game tests (see TESTING.md), never part of a release
        "${mod_id}test" {
            sourceSet sourceSets.gametest
        }
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        // the client run contains the test mod for manual tests
        client {
            client()
            gameDirectory = this.mkdir(this.file("runs/client"))
            sourceSet = sourceSets.gametest
            loadedMods = [mods."${mod_id}", mods."${mod_id}test"]
        }
        // GameTests (see TESTING.md): ./gradlew :neoforge:runGameTestServer (runs both game test servers)
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            gameDirectory = this.mkdir(this.file("runs/gametest"))
            loadedMods = [mods."${mod_id}", mods."${mod_id}test"]
            systemProperty('bucketlibtest.milkEnabled', 'false') // checked by meta/milk_fluid_matches_the_run
            programArguments.addAll '--tests', "${mod_id}:*".toString(), '--report', file('build/gametest-report.xml').getAbsolutePath()
        }
        // the same game tests with the NeoForge milk fluid enabled (NeoForgeMod.enableMilkFluid() by the test mod)
        gameTestServerMilk {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            gameDirectory = this.mkdir(this.file("runs/gametest-milk"))
            loadedMods = [mods."${mod_id}", mods."${mod_id}test"]
            systemProperty('bucketlibtest.milkEnabled', 'true')
            programArguments.addAll '--tests', "${mod_id}:*".toString(), '--report', file('build/gametest-milk-report.xml').getAbsolutePath()
        }
        data {
            clientData()
            gameDirectory = this.mkdir(this.file("runs/data"))
            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            loadedMods = [mods."${mod_id}"]
        }
        server {
            server()
            this.file("runs/server").createParentDirectories()
            gameDirectory = this.mkdir(this.file("runs/server"))
            loadedMods = [mods."${mod_id}"]
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// runGameTestServer (used by all loaders and the CI) also runs the game tests with the milk fluid
tasks.named('runGameTestServer') {
    finalizedBy 'runGameTestServerMilk'
}
tasks.named('runGameTestServerMilk') {
    mustRunAfter 'runGameTestServer'
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}